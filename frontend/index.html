<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Itnig Triage Inbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #0f0f0f; color: #f0f0f0; min-height: 100vh; }
    header { padding: 20px 32px; border-bottom: 1px solid #1e1e1e;
             display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 16px; font-weight: 600; }
    header a { font-size: 13px; color: #666; text-decoration: none; }
    header a:hover { color: #aaa; }
    .counts { display: flex; gap: 24px; padding: 20px 32px; border-bottom: 1px solid #1e1e1e; }
    .count { font-size: 13px; color: #666; }
    .count span { font-weight: 600; color: #f0f0f0; margin-right: 4px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
         text-transform: uppercase; color: #555; padding: 12px 16px;
         border-bottom: 1px solid #1e1e1e; }
    td { padding: 14px 16px; border-bottom: 1px solid #161616;
         font-size: 14px; vertical-align: middle; }
    tr:hover td { background: #141414; }
    .verdict { display: inline-flex; align-items: center; gap: 6px;
               padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .FAST_TRACK { background: #1a2e1a; color: #4ade80; }
    .PRIORITY   { background: #1a2a1a; color: #22c55e; }
    .REVIEW     { background: #2a2510; color: #fbbf24; }
    .REJECT     { background: #2a1515; color: #f87171; }
    .score-bar { display: flex; align-items: center; gap: 8px; }
    .bar { height: 4px; border-radius: 2px; background: #222; width: 80px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
    .score-num { font-size: 13px; font-weight: 600; min-width: 28px; }
    .actions { display: flex; gap: 6px; }
    .btn { padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
           border: 1px solid #2a2a2a; background: transparent; color: #aaa;
           transition: all 0.15s; }
    .btn:hover { background: #222; color: #fff; }
    .btn.reply { border-color: #22c55e; color: #22c55e; }
    .btn.reply:hover { background: #1a2e1a; }
    .company { font-weight: 500; }
